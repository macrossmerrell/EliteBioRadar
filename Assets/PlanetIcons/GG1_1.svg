<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <defs>
    <radialGradient id="shade" cx="36%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".5"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity=".35"/>
    </radialGradient>
    <clipPath id="clip"><circle cx="150" cy="150" r="105"/></clipPath>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="stormBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  <g filter="url(#glow)">
    <g clip-path="url(#clip)">
      <rect x="45" y="45" width="210" height="210" fill="#d8e2e8"/>
      <rect x="45" y="70" width="210" height="20" fill="#b8c8d4" opacity=".8"/>
      <rect x="45" y="105" width="210" height="14" fill="#93a8b8" opacity=".7"/>
      <rect x="45" y="132" width="210" height="26" fill="#c4d2dc" opacity=".6"/>
      <rect x="45" y="170" width="210" height="16" fill="#84a0b4" opacity=".7"/>
      <rect x="45" y="198" width="210" height="22" fill="#b0c4d0" opacity=".7"/>
      <rect x="45" y="230" width="210" height="12" fill="#6c8a9c" opacity=".6"/>
      <ellipse cx="178" cy="150" rx="20" ry="10" fill="#4a6474" opacity=".5" filter="url(#stormBlur)" transform="rotate(-8 178 150)"/>
      <circle cx="150" cy="150" r="105" fill="url(#shade)"/>
    </g>
  </g>
</svg>
