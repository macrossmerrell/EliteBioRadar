<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <defs>
    <radialGradient id="shade" cx="36%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".5"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity=".35"/>
    </radialGradient>
    <clipPath id="clip"><circle cx="150" cy="150" r="105"/></clipPath>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="stormBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  <g filter="url(#glow)">
    <g clip-path="url(#clip)">
      <rect x="45" y="45" width="210" height="210" fill="#f0d8b8"/>
      <rect x="45" y="70" width="210" height="20" fill="#e0bd8c" opacity=".8"/>
      <rect x="45" y="105" width="210" height="14" fill="#c79a5e" opacity=".7"/>
      <rect x="45" y="132" width="210" height="26" fill="#eccd9e" opacity=".6"/>
      <rect x="45" y="170" width="210" height="16" fill="#bc8e50" opacity=".7"/>
      <rect x="45" y="198" width="210" height="22" fill="#e2c090" opacity=".7"/>
      <rect x="45" y="230" width="210" height="12" fill="#a87c42" opacity=".6"/>
      <ellipse cx="120" cy="128" rx="14" ry="8" fill="#8a5a2c" opacity=".5" filter="url(#stormBlur)" transform="rotate(10 120 128)"/>
      <ellipse cx="190" cy="184" rx="11" ry="6" fill="#8a5a2c" opacity=".45" filter="url(#stormBlur)" transform="rotate(-14 190 184)"/>
      <circle cx="150" cy="150" r="105" fill="url(#shade)"/>
    </g>
  </g>
</svg>
