      <ellipse cx="112" cy="128" rx="18" ry="11" fill="#742c14" transform="rotate(-15 112 128)"/>
      <ellipse cx="188" cy="158" rx="15" ry="8" fill="#a8502a" transform="rotate(20 188 158)"/>
      <ellipse cx="140" cy="196" rx="12" ry="7" fill="#5c2410" transform="rotate(8 140 196)"/>
    </g>
    <!-- polar ice cap -->
    <ellipse cx="140" cy="66" rx="66" ry="36" fill="#eaf3f8" opacity=".78"/>
    <ellipse cx="150" cy="80" rx="48" ry="24" fill="#eaf3f8" opacity=".5"/>
