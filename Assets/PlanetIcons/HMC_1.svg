<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <defs>
    <radialGradient id="hg1" cx="36%" cy="32%" r="72%">
      <stop offset="0%" stop-color="#f0a888"/>
      <stop offset="30%" stop-color="#c9603c"/>
      <stop offset="62%" stop-color="#8a3820"/>
      <stop offset="85%" stop-color="#4a1c10"/>
      <stop offset="100%" stop-color="#1c0b06"/>
    </radialGradient>
    <filter id="hglow1" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="hclip1"><circle cx="150" cy="150" r="100"/></clipPath>
  </defs>
  <circle cx="150" cy="150" r="100" fill="url(#hg1)" filter="url(#hglow1)"/>
