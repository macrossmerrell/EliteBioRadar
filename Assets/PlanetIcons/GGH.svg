<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <defs>
    <radialGradient id="shade" cx="36%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".6"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity=".3"/>
    </radialGradient>
    <clipPath id="clip"><circle cx="150" cy="150" r="104"/></clipPath>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)">
    <g clip-path="url(#clip)">
      <rect x="46" y="46" width="208" height="208" fill="#f5fbff"/>
      <rect x="46" y="74" width="208" height="14" fill="#d8ecfa" opacity=".7"/>
      <rect x="46" y="104" width="208" height="18" fill="#b8d9ee" opacity=".6"/>
      <rect x="46" y="136" width="208" height="12" fill="#e8f4fb" opacity=".55"/>
      <rect x="46" y="168" width="208" height="16" fill="#a8cfe6" opacity=".6"/>
      <rect x="46" y="200" width="208" height="14" fill="#dcedf7" opacity=".6"/>
      <circle cx="150" cy="150" r="104" fill="url(#shade)"/>
    </g>
  </g>
</svg>
