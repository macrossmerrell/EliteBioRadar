<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <defs>
    <radialGradient id="shade" cx="36%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".5"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity=".35"/>
    </radialGradient>
    <clipPath id="clip"><circle cx="150" cy="150" r="105"/></clipPath>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="stormBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  <g filter="url(#glow)">
    <g clip-path="url(#clip)">
      <rect x="45" y="45" width="210" height="210" fill="#e0f2ff"/>
      <rect x="45" y="72" width="210" height="18" fill="#c0e0f7" opacity=".8"/>
      <rect x="45" y="104" width="210" height="14" fill="#9cc8ec" opacity=".7"/>
      <rect x="45" y="130" width="210" height="24" fill="#d4ecfb" opacity=".6"/>
      <rect x="45" y="168" width="210" height="16" fill="#87b9e4" opacity=".7"/>
      <rect x="45" y="196" width="210" height="20" fill="#c2e0f6" opacity=".7"/>
      <rect x="45" y="226" width="210" height="12" fill="#78a9d8" opacity=".6"/>
      <ellipse cx="126" cy="164" rx="16" ry="8" fill="#3d68a8" opacity=".4" filter="url(#stormBlur)" transform="rotate(-10 126 164)"/>
      <circle cx="150" cy="150" r="105" fill="url(#shade)"/>
    </g>
  </g>
</svg>
