<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <defs>
    <radialGradient id="shade" cx="36%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".5"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity=".4"/>
    </radialGradient>
    <clipPath id="clip"><circle cx="150" cy="150" r="105"/></clipPath>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="stormBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  <g filter="url(#glow)">
    <g clip-path="url(#clip)">
      <rect x="45" y="45" width="210" height="210" fill="#7ce0b8"/>
      <rect x="45" y="70" width="210" height="18" fill="#4cc498" opacity=".8"/>
      <rect x="45" y="100" width="210" height="16" fill="#249870" opacity=".75"/>
      <rect x="45" y="128" width="210" height="24" fill="#6cd4ac" opacity=".55"/>
      <rect x="45" y="166" width="210" height="16" fill="#1a7a58" opacity=".75"/>
      <rect x="45" y="194" width="210" height="20" fill="#42ac86" opacity=".7"/>
      <rect x="45" y="224" width="210" height="12" fill="#125c40" opacity=".7"/>
      <ellipse cx="172" cy="146" rx="18" ry="9" fill="#0e4030" opacity=".5" filter="url(#stormBlur)" transform="rotate(8 172 146)"/>
      <circle cx="150" cy="150" r="105" fill="url(#shade)"/>
    </g>
  </g>
</svg>
