<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <defs>
    <radialGradient id="hg4" cx="36%" cy="32%" r="72%">
      <stop offset="0%" stop-color="#e8c6a0"/>
      <stop offset="30%" stop-color="#c69a6a"/>
      <stop offset="62%" stop-color="#8a6238"/>
      <stop offset="85%" stop-color="#4a331b"/>
      <stop offset="100%" stop-color="#1e150b"/>
    </radialGradient>
    <filter id="hglow4" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="hclip4"><circle cx="150" cy="150" r="100"/></clipPath>
  </defs>
  <circle cx="150" cy="150" r="100" fill="url(#hg4)" filter="url(#hglow4)"/>
  <g clip-path="url(#hclip4)">
    <g opacity=".3">
      <ellipse cx="126" cy="140" rx="14" ry="8" fill="#61432a" transform="rotate(-15 126 140)"/>
      <ellipse cx="176" cy="160" rx="11" ry="6" fill="#946a3e" transform="rotate(18 176 160)"/>
    </g>
    <!-- dual polar ice caps, north larger than south -->
    <ellipse cx="140" cy="64" rx="60" ry="32" fill="#eef4f7" opacity=".72"/>
    <ellipse cx="150" cy="238" rx="42" ry="22" fill="#eef4f7" opacity=".55"/>
