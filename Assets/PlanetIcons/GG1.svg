<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <defs>
    <radialGradient id="shade" cx="36%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".5"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity=".35"/>
    </radialGradient>
    <clipPath id="clip"><circle cx="150" cy="150" r="105"/></clipPath>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)">
    <g clip-path="url(#clip)">
      <rect x="45" y="45" width="210" height="210" fill="#f0e6c8"/>
      <rect x="45" y="70" width="210" height="20" fill="#e0d0a0" opacity=".8"/>
      <rect x="45" y="105" width="210" height="14" fill="#cbb884" opacity=".7"/>
      <rect x="45" y="132" width="210" height="26" fill="#e8dcb4" opacity=".6"/>
      <rect x="45" y="170" width="210" height="16" fill="#c4b078" opacity=".7"/>
      <rect x="45" y="198" width="210" height="22" fill="#ddd0a4" opacity=".7"/>
      <rect x="45" y="230" width="210" height="12" fill="#b8a26c" opacity=".6"/>
      <circle cx="150" cy="150" r="105" fill="url(#shade)"/>
    </g>
  </g>
</svg>
