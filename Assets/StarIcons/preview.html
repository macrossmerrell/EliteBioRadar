<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Star Icon Set — Preview</title>
<style>
  body{background:#0a0f0f;color:#88bbbb;font-family:Consolas,monospace;padding:30px;}
  h1{color:#00e5ff;font-size:16px;letter-spacing:.05em;font-weight:normal;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:18px;max-width:1100px;}
  .cell{background:#0d1a1a;border:1px solid #1a4444;padding:10px;text-align:center;}
  .cell img{width:100%;height:120px;object-fit:contain;}
  .cell div{margin-top:6px;font-size:11px;color:#00e5ff;letter-spacing:.04em;}
</style>
</head>
<body>
  <h1>ELITE BIO RADAR — STAR ICON SET</h1>
  <div class="grid">
    <div class="cell"><img src="star_O.svg"><div>O</div></div>
    <div class="cell"><img src="star_B.svg"><div>B</div></div>
    <div class="cell"><img src="star_A.svg"><div>A</div></div>
    <div class="cell"><img src="star_F.svg"><div>F</div></div>
    <div class="cell"><img src="star_G.svg"><div>G</div></div>
    <div class="cell"><img src="star_K.svg"><div>K</div></div>
    <div class="cell"><img src="star_M.svg"><div>M</div></div>
    <div class="cell"><img src="star_WhiteDwarf.svg"><div>WHITE DWARF</div></div>
    <div class="cell"><img src="star_NeutronStar.svg"><div>NEUTRON STAR</div></div>
    <div class="cell"><img src="star_BlackHole.svg"><div>BLACK HOLE</div></div>
    <div class="cell"><img src="star_BrownDwarf_L.svg"><div>BROWN DWARF L</div></div>
    <div class="cell"><img src="star_BrownDwarf_T.svg"><div>BROWN DWARF T</div></div>
    <div class="cell"><img src="star_BrownDwarf_Y.svg"><div>BROWN DWARF Y</div></div>
    <div class="cell"><img src="star_W.svg"><div>WOLF-RAYET W</div></div>
    <div class="cell"><img src="star_WC.svg"><div>WOLF-RAYET WC</div></div>
    <div class="cell"><img src="star_WN.svg"><div>WOLF-RAYET WN</div></div>
    <div class="cell"><img src="star_WNC.svg"><div>WOLF-RAYET WNC</div></div>
    <div class="cell"><img src="star_WO.svg"><div>WOLF-RAYET WO</div></div>
  </div>
</body>
</html>
